baseURL = 'https://pierangeloc.github.io/'
languageCode = 'en-us'
title = 'BLOG'
theme = 'HugoTeX'

[pagination]
  pagerSize = 3

[Params.author]
  name = "Pierangelo Cecchetto"
  abstract = """
  I'm a software engineer living in Amsterdam. Interested in Functional Programming techniques, mostly using in Scala, but also and Rust and Typescript.
  """

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "paraiso-dark"

[Params]
  lightmode = true
  copyright-year = '2024'
  subtitle = 'Notes of a Software Engineer'
  [params.layouts]
    rfc_1123 = 'Mon, 02 Jan 2006 15:04:05 MST'
    rfc_3339 = '2006-01-02T15:04:05-07:00'
